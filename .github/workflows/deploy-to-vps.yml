name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: infinia
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "Moving to project directory..."
          cd /var/www/medremote-backend

          echo "Configuring git remote (public HTTPS URL)..."
          # Public repo: no token needed for pulling.
          git remote set-url origin https://github.com/kol123-dev/MedRemoteServer.git

          echo "Fetching from origin..."
          # Sync tracked files to origin/main.
          # NOTE: .env is git-ignored, so it stays untouched on the server.
          git fetch origin
          git checkout -f main
          git reset --hard origin/main

          echo "Installing dependencies..."
          # Build with the production .env already present on the server.
          # Dependencies install from the fresh package-lock.
          npm ci
          
          echo "Generating Prisma client..."
          npx prisma generate
          
          echo "Building project..."
          npm run build

          echo "Applying migrations..."
          # Apply any committed schema migrations.
          npx prisma migrate deploy

          echo "Restarting PM2 process..."
          # Reload the API with PM2, or start if it doesn't exist.
          # Because tsconfig uses rootDir ".", the build lands at dist/src/server.js.
          pm2 reload ecosystem.config.cjs || pm2 start ecosystem.config.cjs